send_anonymous_usage_stats: true
project_id: "tap-comeen-qoben"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-comeen-qoben"
    namespace: "tap_comeen_qoben"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings:
    - name: client_id
      label: Client ID
      description: The client ID from the Qoben portal administration menu
      sensitive: true

    - name: client_secret
      label: Client Secret
      description: The API key (secret) from the Qoben portal administration menu
      sensitive: true

    - name: api_url
      label: API URL
      description: The base URL for the Qoben API
      value: https://api.qoben.co

    settings_group_validation:
    - [client_id, client_secret]

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
